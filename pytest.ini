[pytest]
# CS 401R Lab 4 starter kit. Keep this file at the repo root.
#
# Puts the repo root on sys.path so `from data.feature_engineering import ...`
# resolves under plain `pytest tests/`. Without it only `python -m pytest`
# works, because that form adds the current directory itself.
pythonpath = .
testpaths = tests
# byu_pytest_utils (installed globally for another class) crashes collection
# here; disable it for this repo only. Harmless where it isn't installed.
addopts = -p no:byu_pytest_utils
